<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Comunicados • Marcador de Treino</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080e09;color:#efffea;font-family:system-ui,-apple-system,sans-serif;line-height:1.5;padding:18px}main{max-width:720px;margin:auto}h1{margin:12px 0;font-size:25px}h2{font-size:19px;margin:2px 0 14px}p{color:#b2c6a8;font-size:13px}section,article{background:linear-gradient(130deg,#182718,#111b11);border:1px solid #3e5935;border-radius:18px;padding:17px;margin:13px 0}label{display:block;margin:12px 0 6px;font-weight:700;font-size:13px}input,textarea{width:100%;padding:13px;font:inherit;font-size:14px;color:#f7ffed;background:#0c160d;border:1px solid #536747;border-radius:12px}textarea{min-height:135px;resize:vertical}input:focus,textarea:focus{outline:2px solid #a6ff00}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:#a6ff00;color:#1a2d07}button:disabled{opacity:.45}button.secondary{background:#273c21;color:#c1ff9d;border:1px solid #577548}a{color:#adff43;text-decoration:none}nav{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;padding:13px 0}small{color:#a5bb9c}#status{font-size:12px;min-height:20px;color:#c1ff96}#feed article{background:#101c12}article h3{margin:0 0 5px;font-size:17px}article p{white-space:pre-wrap;overflow-wrap:anywhere}article footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}em{color:#8d9f87;font-size:12px}
</style></head><body><main><nav><a href="/">Marcador de Treino</a><a href="/admin-exercise-suggestions.html">Sugestões de exercícios</a></nav>
<h1>💚 Painel do proprietário</h1><p>Somente o dono do aplicativo pode publicar avisos. Eles aparecem no sininho de todos os usuários.</p>
<section><h2>Novo comunicado</h2><form id="compose"><label for="title">Título do aviso</label><input id="title" maxlength="100" minlength="3" required placeholder="Ex.: Novos exercícios disponíveis">
<label for="message">Mensagem</label><textarea id="message" maxlength="1500" minlength="3" required placeholder="Escreva aqui o que todos vão ver no aplicativo..."></textarea><button id="publish" type="submit">Publicar para todos</button></form><p id="status" role="status" aria-live="polite"></p></section>
<h2>Avisos publicados</h2><div id="feed"></div>
</main><script>
const $=x=>document.getElementById(x);
function authError(status,body){if(status===401){if(body?.login_url){const a=document.createElement('a');a.href=body.login_url;a.textContent='Entrar como proprietário';$('status').replaceChildren(a);return new Error('Entre na tua conta do Hatchable para administrar.')}return new Error('Entre na sua conta de dono no Hatchable e volte para esta página.')}return new Error(status===403?'Acesso restrito ao proprietário do projeto.':'Erro '+status)}
async function api(body){
 const r=await fetch('/api/admin/announcements',{method:body?'POST':'GET',credentials:'include',cache:'no-store',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,redirect:'manual'});
 if(r.type==='opaqueredirect'){location.href='https://hatchable.com/console/login';throw Error('Faça login como proprietário.')}
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw authError(r.status,data);
 return data;
}
async function load(){try{const data=await api();const feed=$('feed');feed.replaceChildren();if(!data.announcements.length){const p=document.createElement('p');p.textContent='Nenhum comunicado publicado ainda.';feed.append(p)}for(const n of data.announcements){const box=document.createElement('article');const h=document.createElement('h3');h.textContent=n.title;const p=document.createElement('p');p.textContent=n.body;const foot=document.createElement('footer');const time=document.createElement('small');time.textContent=new Date(n.createdAt).toLocaleString('pt-BR')+(n.active?' • Visível':' • Oculto');const btn=document.createElement('button');btn.className='secondary';btn.textContent=n.active?'Ocultar aviso':'Mostrar novamente';btn.onclick=async()=>{btn.disabled=true;try{await api({operation:n.active?'hide':'show',id:n.id});await load()}catch(e){$('status').textContent=e.message;btn.disabled=false}};foot.append(time,btn);box.append(h,p,foot);feed.append(box)}}catch(e){$('status').textContent=e.message}}
$('compose').onsubmit=async e=>{e.preventDefault();const button=$('publish');button.disabled=true;$('status').textContent='Publicando aviso...';try{await api({operation:'publish',title:$('title').value.trim(),message:$('message').value.trim()});$('compose').reset();$('status').textContent='Aviso publicado! Vai aparecer no sininho dos usuários. 💚';await load()}catch(e){$('status').textContent=e.message}finally{button.disabled=false}};
load();
</script></body></html>
