<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sugestões de exercícios • Administração</title><style>body{margin:0;background:#090f09;color:#e9ffe5;font-family:system-ui,sans-serif;padding:20px}main{max-width:760px;margin:0 auto}h1{font-size:24px}p{color:#b9cead}button{cursor:pointer;background:#a6ff00;color:#1b2a11;border:0;padding:10px;border-radius:9px;font-weight:800}article{background:#152015;border:1px solid #425d31;border-radius:13px;padding:15px;margin:12px 0}small{color:#a8bca5}article p{white-space:pre-wrap;line-height:1.5}article button{font-size:12px;margin:6px 6px 0 0}.secondary{background:#293c24;color:#ddffca}a{color:#b7ff60}</style></head><body><main><h1>💚 Sugestões de exercícios</h1><p>Área de administração — somente o proprietário e administradores autorizados podem consultar ou alterar as sugestões.</p><p id="message" role="status">Carregando...</p><section id="items"></section><p><a href="/">Voltar ao aplicativo</a></p></main><script>
const el=document.getElementById('items'),status=document.getElementById('message');
async function call(opt){const r=await fetch('/api/admin/exercise-suggestions',{credentials:'include',cache:'no-store',...opt});if(!r.ok)throw Error(r.status===401||r.status===403?'Acesso restrito ao administrador. Abra esta página com sua conta de proprietário conectada ao Hatchable.':'Não foi possível carregar as sugestões ('+r.status+').');return r.json()}
async function load(){try{const data=await call();status.textContent=data.suggestions.length+' sugestões recebidas';el.replaceChildren();for(const s of data.suggestions){const a=document.createElement('article');const h=document.createElement('h3');h.textContent=s.exerciseName;const p=document.createElement('p');p.textContent=s.comment||'Sem observações';const details=document.createElement('small');details.textContent='Status: '+s.status+' • '+new Date(s.createdAt).toLocaleString('pt-BR');a.append(h,p,details);for(const [value,label] of [['reviewed','Marcar revisada'],['added','Adicionado à biblioteca'],['pending','Pendente']]){const btn=document.createElement('button');btn.textContent=label;if(value!=='added')btn.className='secondary';btn.disabled=s.status===value;btn.onclick=async()=>{btn.disabled=true;try{await call({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:s.id,status:value})});await load()}catch(e){status.textContent=e.message}};a.append(btn)}el.append(a)}}catch(e){status.textContent=e.message;el.replaceChildren()}}
load();
</script></body></html>
