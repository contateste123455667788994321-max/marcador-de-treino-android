name: Gerar APK do Marcador de Treino
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar Android SDK
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "Usando $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Marcador-de-Treino-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK para download direto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$APP_VERSION" ]; then echo "Versão não encontrada"; exit 1; fi
          TAG="v$APP_VERSION"
          APK_NAME="Marcador_de_Treino_Android_${APP_VERSION//./_}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME" --title "Marcador de Treino Android $APP_VERSION" --notes "Versão Android $APP_VERSION (APK de teste). Faça backup dos dados antes de substituir a instalação anterior." --latest --target "$GITHUB_SHA"
          fi
